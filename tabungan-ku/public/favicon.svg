<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="piggyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Piggy Bank Body -->
  <ellipse cx="50" cy="55" rx="35" ry="28" fill="url(#piggyGradient)"/>
  
  <!-- Piggy Bank Head -->
  <circle cx="70" cy="45" r="18" fill="url(#piggyGradient)"/>
  
  <!-- Snout -->
  <ellipse cx="82" cy="45" rx="6" ry="8" fill="#059669"/>
  <circle cx="80" cy="43" r="1.5" fill="#065f46"/>
  <circle cx="80" cy="47" r="1.5" fill="#065f46"/>
  
  <!-- Eye -->
  <circle cx="68" cy="40" r="3" fill="#ffffff"/>
  <circle cx="69" cy="40" r="1.5" fill="#065f46"/>
  
  <!-- Ear -->
  <ellipse cx="72" cy="32" rx="4" ry="7" fill="#059669"/>
  
  <!-- Legs -->
  <rect x="28" y="75" width="8" height="12" rx="4" fill="#059669"/>
  <rect x="45" y="75" width="8" height="12" rx="4" fill="#059669"/>
  <rect x="62" y="75" width="8" height="12" rx="4" fill="#059669"/>
  
  <!-- Coin Slot -->
  <rect x="42" y="35" width="12" height="3" rx="1.5" fill="#065f46"/>
  
  <!-- Coin -->
  <circle cx="48" cy="25" r="8" fill="#fbbf24"/>
  <circle cx="48" cy="25" r="6" fill="#f59e0b"/>
  <text x="48" y="29" font-family="Arial" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle">Rp</text>
</svg>
